name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift build && swift test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # NudgeCore only; the AppKit shell is compiled out on Linux.
          - name: Linux
            os: ubuntu-latest
            container: swift:5.10-jammy
          # Also compiles the AppKit/EventKit shell.
          - name: macOS
            os: macos-15
            container: ''
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  secrets:
    name: betterleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETTERLEAKS_VERSION: "1.10.1"
      BETTERLEAKS_SHA256: "c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e"
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install betterleaks
        run: |
          set -euo pipefail
          tarball="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${tarball}"
          echo "${BETTERLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/bin" betterleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan git history
        run: betterleaks git --redact --verbose --exit-code 1 .
