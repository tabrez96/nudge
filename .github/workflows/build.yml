name: Build

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build Nudge.app (Release)
        run: scripts/make-app.sh

      - name: Verify app bundle
        run: |
          app=build/Nudge.app
          test -x "$app/Contents/MacOS/Nudge"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$app"

      # upload-artifact drops Unix permissions, so zip with ditto to keep the binary executable.
      - name: Zip app bundle
        run: ditto -c -k --keepParent build/Nudge.app build/Nudge.zip

      - name: Upload Nudge.app
        uses: actions/upload-artifact@v4
        with:
          name: Nudge-app
          path: build/Nudge.zip
          if-no-files-found: error
          retention-days: 14
